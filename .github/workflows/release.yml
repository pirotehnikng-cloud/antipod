name: Auto Release AntiPod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    name: Check Cargo.toml Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      should_release: ${{ steps.ver.outputs.should_release }}

    steps:
      - uses: actions/checkout@v7
      - name: Compare Cargo.toml version with existing tags
        id: ver
        run: |
          VER=$(grep -m1 -E '^version[[:space:]]*=[[:space:]]*"' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/' | tr -d '\r')
          if [ -z "$VER" ]; then
            echo "::error::Не удалось найти поле version в Cargo.toml"
            exit 1
          fi
          TAG="v${VER}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "refs/tags/${TAG}$"; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Релиз ${TAG} уже существует — сборка пропущена."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Обнаружена новая версия ${TAG} — запускаем сборку релиза."
          fi

  build-and-release:
    name: Build & Publish Windows x64
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Sync tauri.conf.json version with Cargo.toml
        shell: pwsh
        run: |
          $ver = "${{ needs.check-version.outputs.version }}"
          $confPath = "crates/antipod-gui/src-tauri/tauri.conf.json"
          $raw = Get-Content $confPath -Raw
          $updated = $raw -replace '("version"\s*:\s*")[^"]+(")', ('${1}' + $ver + '${2}')
          [System.IO.File]::WriteAllText((Resolve-Path $confPath).Path, $updated, [System.Text.UTF8Encoding]::new($false))

      - name: Install GUI deps and generate Windows icons
        working-directory: crates/antipod-gui
        run: |
          npm install
          npx tauri icon ../../assets/icon.png

      - name: Run Rust unit tests
        run: cargo test -p antipod-core -p antipod-cli

      - name: Build CLI release binary
        run: cargo build -p antipod-cli --release

      - name: Build Tauri v2 Windows installers (NSIS + MSI)
        working-directory: crates/antipod-gui
        run: npx tauri build --bundles nsis,msi

      - name: Package artifacts and generate SHA256SUMS.txt
        shell: pwsh
        run: |
          $tag = "${{ needs.check-version.outputs.tag }}"
          $outDir = "release-artifacts"
          $cliStage = "dist-cli"
          $cliZip = "$outDir\antipod-cli-$tag-windows-x64.zip"

          New-Item -ItemType Directory -Force -Path $outDir, $cliStage | Out-Null

          Copy-Item "target\release\antipod.exe" "$cliStage\"
          Copy-Item "examples\profiles.example.toml" "$cliStage\"
          Copy-Item "README.md" "$cliStage\"
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" "$cliStage\" }
          if (Test-Path "NOTICE") { Copy-Item "NOTICE" "$cliStage\" }
          Compress-Archive -Path "$cliStage\*" -DestinationPath $cliZip -Force

          Get-ChildItem "target\release\bundle\nsis\*-setup.exe" | Copy-Item -Destination $outDir
          Get-ChildItem "target\release\bundle\msi\*.msi" | Copy-Item -Destination $outDir

          $hashes = Get-ChildItem $outDir -File | ForEach-Object {
            $h = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash
            "$h  $($_.Name)"
          }
          $hashes | Out-File -FilePath "$outDir\SHA256SUMS.txt" -Encoding ascii

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.check-version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "AntiPod ${{ needs.check-version.outputs.tag }}"
          generate_release_notes: true
          files: |
            release-artifacts/*
