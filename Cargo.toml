[workspace]
resolver = "2"
members = [
    "crates/antipod-core",
    "crates/antipod-cli",
    "crates/antipod-gui/src-tauri",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/pirotehnikng-cloud/antipod"
description = "Isolated multi-account launcher for Google Antigravity on Windows"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "2.0"
anyhow = "1.0"
directories = "6.0"
clap = { version = "4.5", features = ["derive"] }
sysinfo = "0.33"
junction = "1.2"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
